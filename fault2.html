<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平移斷層與地形變化模擬</title>
    <!-- 引入 Tailwind CSS 作為排版基礎 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入手繪風格字體 Klee One -->
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body {
            font-family: 'Klee One', cursive;
            background-color: #fcf9f2; /* 溫暖的紙張背景色 */
            color: #5c4033; /* 深棕色字體 */
            margin: 0;
            overflow: hidden; /* 隱藏全局捲動條，以 3D 畫布為主 */
        }
        
        .hand-drawn-border {
            border: 3px solid #5c4033;
            /* 模擬手繪不規則圓角 */
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            background-color: #fffaf0;
            box-shadow: 4px 4px 0px rgba(92, 64, 51, 0.2);
        }

        .hand-drawn-btn {
            border: 2px solid #5c4033;
            border-radius: 20px 255px 15px 225px / 255px 15px 225px 15px;
            background-color: #decfb0;
            transition: all 0.2s ease;
            cursor: pointer;
            text-align: center;
            display: inline-block;
        }

        .hand-drawn-btn:hover {
            background-color: #c9b794;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px rgba(92, 64, 51, 0.3);
        }

        .hand-drawn-btn:active {
            transform: translate(0px, 0px);
            box-shadow: 0px 0px 0px rgba(92, 64, 51, 0.3);
        }

        /* 自訂手繪風滑桿 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #d67a55; /* 溫暖的磚紅色 */
            border: 2px solid #5c4033;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 2px 2px 0px rgba(92, 64, 51, 0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #decfb0;
            border-radius: 10px;
            border: 1px solid #5c4033;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen">

    <div class="w-full md:w-1/3 h-full p-6 flex flex-col z-10 overflow-y-auto relative">
        <div class="hand-drawn-border p-6 flex-1 flex flex-col">
            <h1 class="text-3xl font-bold mb-2 text-center">平移斷層模擬室</h1>
            <p class="text-sm text-center mb-6 text-gray-600">滑動地層，從鳥瞰視角觀察馬路與地標的變化！</p>
            
            <!-- 控制區 -->
            <div class="mb-6 space-y-5">
                <div>
                    <label class="block text-lg font-bold mb-1">【地層A】滑動 (有房子)</label>
                    <input type="range" id="leftBlockSlider" min="-3" max="3" step="0.1" value="0">
                </div>
                <div>
                    <label class="block text-lg font-bold mb-1">【地層B】滑動 (有樹木)</label>
                    <input type="range" id="rightBlockSlider" min="-3" max="3" step="0.1" value="0">
                </div>
                <div class="flex space-x-2 mt-4">
                    <button id="birdseyeBtn" class="hand-drawn-btn w-1/2 py-2 text-lg font-bold">
                        🦅 鳥瞰視角
                    </button>
                    <button id="resetBtn" class="hand-drawn-btn w-1/2 py-2 text-lg font-bold">
                        🔄 恢復原狀
                    </button>
                </div>
            </div>

            <!-- 解說區 -->
            <div class="mt-auto pt-4 border-t-2 border-dashed border-[#5c4033]">
                <h2 id="statusTitle" class="text-xl font-bold mb-2 text-[#d67a55]">目前狀態：未錯動</h2>
                <p id="statusDesc" class="text-lg leading-relaxed">
                    目前斷層未發生錯動，馬路暢通無阻。<br>
                    請試著拉動滑桿，並點擊「鳥瞰視角」，想像自己站在其中一側看著對面！
                </p>
            </div>
        </div>

        <!-- 老頭子專屬簽名檔 -->
        <div style="text-align: right; margin-top: 40px; padding-bottom: 20px; font-size: 0.9em; color: #666;">
            by Jay's Lab 紅樓老頭子 系統版本：v1.0
        </div>
    </div>

    <div id="canvas-container" class="w-full md:w-2/3 h-full relative cursor-move bg-[#fcf9f2]">
        <div class="absolute top-4 right-4 text-sm text-gray-500 bg-white/70 px-2 py-1 rounded hand-drawn-border pointer-events-none z-10">
            🖱️ 拖曳可旋轉視角 / 滾輪可縮放
        </div>
    </div>

    <script>
        // 基本場景設定
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfcf9f2); // 溫暖背景色

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 8, 14); // 初始視角 (斜角)

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // 避免看到地底下

        // 打光設定
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
        dirLight.position.set(10, 15, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        // 材質庫
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0xb5c18e }),
            soil: new THREE.MeshLambertMaterial({ color: 0xdecfb0 }),
            rock: new THREE.MeshLambertMaterial({ color: 0x8c7a6b }),
            road: new THREE.MeshLambertMaterial({ color: 0x9ca3af }),
            wall: new THREE.MeshLambertMaterial({ color: 0xfffaf0 }),
            roof: new THREE.MeshLambertMaterial({ color: 0xd67a55 }),
            trunk: new THREE.MeshLambertMaterial({ color: 0x5c4033 }),
            leaves: new THREE.MeshLambertMaterial({ color: 0x7a9c59 })
        };
        const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x5c4033, linewidth: 2 });

        // 輔助函式：建立帶有手繪邊線的方塊
        function createBoxWithEdges(w, h, d, material) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, edgeMaterial);
            mesh.add(line);
            return mesh;
        }

        // 建立地層 (寬4, 深12)
        function createLandBlock() {
            const group = new THREE.Group();
            
            const grass = createBoxWithEdges(3.9, 0.5, 12, materials.grass);
            grass.position.y = 1.25;
            group.add(grass);

            const soil = createBoxWithEdges(3.9, 1.5, 12, materials.soil);
            soil.position.y = 0.25;
            group.add(soil);

            const rock = createBoxWithEdges(3.9, 1.0, 12, materials.rock);
            rock.position.y = -1.0;
            group.add(rock);

            // 馬路
            const road = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.05, 2), materials.road);
            road.position.set(0, 1.51, 0);
            road.receiveShadow = true;
            group.add(road);

            return group;
        }

        // --- 地層A (包含房子) ---
        const leftBlockGroup = createLandBlock();
        leftBlockGroup.position.x = -2; // 移到左邊

        // 蓋房子
        const houseGroup = new THREE.Group();
        const wall = createBoxWithEdges(1.5, 1.2, 1.5, materials.wall);
        wall.position.y = 1.5 + 0.6;
        const roofGeo = new THREE.ConeGeometry(1.4, 1, 4);
        roofGeo.rotateY(Math.PI / 4); // 讓屋頂轉正
        const roof = new THREE.Mesh(roofGeo, materials.roof);
        roof.position.y = 1.5 + 1.2 + 0.5;
        roof.castShadow = true;
        const roofEdges = new THREE.LineSegments(new THREE.EdgesGeometry(roofGeo), edgeMaterial);
        roof.add(roofEdges);
        
        houseGroup.add(wall);
        houseGroup.add(roof);
        houseGroup.position.set(0, 0, 3); // 馬路前方
        leftBlockGroup.add(houseGroup);
        scene.add(leftBlockGroup);

        // --- 地層B (包含樹木) ---
        const rightBlockGroup = createLandBlock();
        rightBlockGroup.position.x = 2; // 移到右邊

        // 種樹
        const treeGroup = new THREE.Group();
        const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1, 8);
        const trunk = new THREE.Mesh(trunkGeo, materials.trunk);
        trunk.position.y = 1.5 + 0.5;
        trunk.castShadow = true;
        const leavesGeo = new THREE.SphereGeometry(1, 7, 7);
        const leaves = new THREE.Mesh(leavesGeo, materials.leaves);
        leaves.position.y = 1.5 + 1.2;
        leaves.castShadow = true;
        // 樹葉邊線
        const leavesEdges = new THREE.LineSegments(new THREE.EdgesGeometry(leavesGeo), edgeMaterial);
        leaves.add(leavesEdges);
        
        treeGroup.add(trunk);
        treeGroup.add(leaves);
        treeGroup.position.set(0, 0, -3); // 馬路後方
        rightBlockGroup.add(treeGroup);
        scene.add(rightBlockGroup);


        // --- 文字標籤 ---
        function createTextSprite(message) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRoundedRect = function(x, y, w, h, r) {
                this.beginPath(); this.moveTo(x+r, y); this.lineTo(x+w-r, y); this.quadraticCurveTo(x+w, y, x+w, y+r);
                this.lineTo(x+w, y+h-r); this.quadraticCurveTo(x+w, y+h, x+w-r, y+h); this.lineTo(x+r, y+h);
                this.quadraticCurveTo(x, y+h, x, y+h-r); this.lineTo(x, y+r); this.quadraticCurveTo(x, y, x+r, y); this.fill();
            }
            ctx.fillRoundedRect(10, 10, 236, 108, 15);
            ctx.font = 'bold 40px "Klee One", sans-serif';
            ctx.fillStyle = '#5c4033';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(message, 128, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false }); 
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(3, 1.5, 1);
            return sprite;
        }

        const labelLeft = createTextSprite("地層A");
        labelLeft.position.set(0, 4.5, 0);
        leftBlockGroup.add(labelLeft);

        const labelRight = createTextSprite("地層B");
        labelRight.position.set(0, 4.5, 0);
        rightBlockGroup.add(labelRight);

        // --- UI 控制與邏輯 ---
        const leftSlider = document.getElementById('leftBlockSlider');
        const rightSlider = document.getElementById('rightBlockSlider');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');

        function updateScene() {
            // 滑桿控制 Z 軸 (前後移動)
            const zL = parseFloat(leftSlider.value);
            const zR = parseFloat(rightSlider.value);

            leftBlockGroup.position.z = zL;
            rightBlockGroup.position.z = zR;

            // 判斷左移還右移 (非常重要的地質概念)
            // 邏輯：我們計算「地層B」相對於「地層A」往哪個方向滑。
            // 在 Three.js 中，Z軸正向是往螢幕外，Z軸負向是往螢幕內。
            // 假設我們站在地層A，面向地層B：
            // 如果地層B相對往 Z 軸正向移動 (zR > zL)，對我們來說，對面就是往「右」移動 => 右移斷層
            // 如果地層A相對往 Z 軸負向移動 (zR < zL)，對我們來說，對面就是往「左」移動 => 左移斷層
            
            const relativeMove = zR - zL;

            if (relativeMove > 0.1) {
                statusTitle.innerText = "目前狀態：右移斷層";
                statusTitle.className = "text-xl font-bold mb-2 text-red-600";
                statusDesc.innerHTML = "【右移斷層】發生了！<br><br>這時候請您想像自己站在「房子」旁邊的馬路上，望向對面的「樹木」。您會發現，對面的馬路和樹木都往您的<strong>右手邊</strong>跑了！這就是地質學上的「右移斷層」。";
            } else if (relativeMove < -0.1) {
                statusTitle.innerText = "目前狀態：左移斷層";
                statusTitle.className = "text-xl font-bold mb-2 text-blue-600";
                statusDesc.innerHTML = "【左移斷層】發生了！<br><br>這時候請您想像自己站在「樹木」旁邊的馬路上，望向對面的「房子」。您會發現，對面的馬路和房子都往您的<strong>左手邊</strong>跑了！這就是地質學上的「左移斷層」。";
            } else {
                statusTitle.innerText = "目前狀態：未錯動";
                statusTitle.className = "text-xl font-bold mb-2 text-[#d67a55]";
                statusDesc.innerHTML = "目前斷層未發生錯動，馬路暢通無阻。<br><br>請試著拉動滑桿，並點擊「鳥瞰視角」，想像自己站在其中一側看著對面！";
            }
        }

        // 綁定事件
        leftSlider.addEventListener('input', updateScene);
        rightSlider.addEventListener('input', updateScene);
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            leftSlider.value = 0;
            rightSlider.value = 0;
            updateScene();
            // 重置為斜角
            camera.position.set(0, 8, 14);
            controls.target.set(0, 0, 0);
        });

        document.getElementById('birdseyeBtn').addEventListener('click', () => {
            // 切換到正上方往下看的鳥瞰視角
            // 微微偏移 x=0.1 避免 OrbitControls 算錯上向向量(Up Vector)而翻轉
            camera.position.set(0.1, 16, 0); 
            controls.target.set(0, 0, 0);
        });

        // 初始化
        updateScene();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 啟動動畫
        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
