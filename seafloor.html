<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深海調查員：海底擴張之謎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5e9cf;--paper2:#fdf6e6;--ink:#4a3526;--ink2:#7a5c45;--sun:#f0b54f;--rust:#c8643b;--teal:#a9d0c8;--sand:#e2c08d;
--font:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);font-size:17px;line-height:1.7;background-color:var(--paper);
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.logo{font-size:36px;transform:rotate(-8deg)}
h1{font-size:28px;margin:0;letter-spacing:3px;line-height:1.2}
.sub{font-size:14px;color:var(--ink2)}
.pills{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.pill{font:inherit;font-size:14px;padding:2px 10px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);cursor:pointer;opacity:.45;
border-radius:14px 4px 12px 5px/5px 12px 4px 14px}
.pill.done{opacity:1;background:#f3dcae}.pill.cur{opacity:1;background:var(--sun);font-weight:700;transform:rotate(-2deg)}
.pill:disabled{cursor:not-allowed}
main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:0 16px 20px}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.card{background:var(--paper2);border:2px solid var(--ink);border-radius:18px 6px 16px 8px/8px 16px 6px 18px;box-shadow:4px 5px 0 rgba(74,53,38,.18);padding:12px}
canvas{display:block;width:100%;touch-action:none;border-radius:10px}
#scene{height:330px}#chart{height:250px;margin-top:10px}
body[data-layout=single] #scene{height:560px}body[data-layout=single] #chart{display:none}
body[data-layout=html] #canvWrap{display:none}
#htmlStage{display:none}body[data-layout=html] #htmlStage{display:block}
@media(max-width:640px){#scene{height:260px}#chart{height:220px}body[data-layout=single] #scene{height:440px}}
#controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;min-height:10px}
.btn{font:inherit;font-size:16px;padding:6px 16px;min-height:44px;border:2px solid var(--ink);color:var(--ink);background:var(--sun);cursor:pointer;
border-radius:14px 4px 12px 5px/5px 12px 4px 14px;box-shadow:2px 3px 0 rgba(74,53,38,.3)}
.btn:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(74,53,38,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:#f3dcae}.btn.teal{background:var(--teal)}.btn.big{font-size:19px;padding:8px 22px}
.btn.sm{font-size:15px;min-height:38px;padding:4px 12px}.btn.tiny{font-size:14px;min-height:34px;padding:2px 10px}
.stat{font-size:15px;background:#fff6e2;border:1.5px dashed var(--ink2);padding:4px 10px;border-radius:10px}
aside{display:flex;flex-direction:column;gap:14px}
#guide{max-height:66vh;overflow:auto}
@media(max-width:1000px){#guide{max-height:none}}
.gtitle{display:flex;align-items:center;gap:8px;font-size:19px;border-bottom:2px dashed var(--ink2);padding-bottom:6px;margin-bottom:6px}
.captain{font-size:30px}
.gblock{margin:10px 0;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.task{background:#fff1cf;border:2px solid var(--sun);border-radius:12px 4px 12px 4px;padding:8px 10px}
.task.good{background:#e6f1e2;border-color:#8a9a5b}
.warnbox{background:#fbe1d6;border:2px solid var(--rust);border-radius:12px 4px 12px 4px;padding:8px 10px}
.q{background:#fff;border:2px solid var(--ink);border-radius:14px 5px 12px 6px/6px 12px 5px 14px;padding:10px}
.qt{font-weight:700;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{font:inherit;font-size:16px;text-align:left;padding:6px 10px;min-height:42px;border:1.8px solid var(--ink2);background:var(--paper2);color:var(--ink);cursor:pointer;border-radius:10px 4px 10px 4px}
.opt.sel{background:#f7d58e;border-color:var(--ink)}
.opt:disabled{cursor:default}
.fb{margin-top:6px;font-size:16px}.fb.good{color:#4f6b2d}.fb.hmm{color:#a24a24}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{font:inherit;font-size:16px;padding:6px 8px;border:2px solid var(--ink2);border-radius:8px;background:#fffdf7;color:var(--ink);width:100%}
.inp.num{width:120px}
textarea.inp{resize:vertical;margin-bottom:6px}
.lbl{display:block}
.notebook{background:repeating-linear-gradient(#fdf6e6 0 29px,#e8d9b8 29px 30px);min-height:200px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{font:inherit;font-size:15px;flex:1;border:2px solid var(--ink);background:#f3dcae;color:var(--ink);border-radius:10px 10px 2px 2px;cursor:pointer;padding:3px}
.tabs button.on{background:var(--sun);font-weight:700}
.clue{display:flex;gap:8px;background:#fffaf0;border:1.5px solid var(--ink2);border-radius:8px 3px 8px 3px;padding:6px 8px;margin-bottom:6px;font-size:15px;transform:rotate(-.4deg)}
.clue:nth-child(even){transform:rotate(.5deg)}
.ci{font-size:22px}.csrc{font-size:12px;color:var(--ink2)}
.note{background:#fffaf0;border-left:4px solid var(--sun);padding:5px 8px;margin-bottom:6px;font-size:15px;white-space:pre-wrap}
.muted{color:var(--ink2);font-size:15px}
.hyp{border:2px solid var(--ink);border-radius:10px 4px 10px 4px;padding:6px 8px;margin-bottom:8px;background:#fffaf0}
.hyp .badge{float:right;font-size:13px;padding:0 8px;border-radius:8px;border:1.5px solid var(--ink)}
.hyp.u .badge{background:#eee}.hyp.ok .badge{background:#cfe3b8}.hyp.out{opacity:.55}.hyp.out .badge{background:#f2b8a4}.hyp.out b{text-decoration:line-through}
.hd{font-size:14px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff8e8;padding:8px 18px;border-radius:14px;transition:.3s;z-index:9;pointer-events:none;font-size:16px}
#toast.show{transform:translateX(-50%) translateY(0)}
.telegram{background:#fbf1d8;border:2px solid var(--ink);padding:18px 22px;position:relative;border-radius:4px;box-shadow:inset 0 0 40px rgba(160,120,70,.18);max-width:760px;margin:10px auto}
.telegram.small{padding:10px 12px;font-size:15px}
.tg-head{font-weight:700;font-size:20px;letter-spacing:4px;border-bottom:2px double var(--ink);margin-bottom:6px}
.telegram.small .tg-head{font-size:16px;letter-spacing:1px}
.tg-date{color:var(--ink2)}
.stamp{position:absolute;right:18px;top:14px;border:3px solid var(--rust);color:var(--rust);padding:0 10px;font-size:22px;font-weight:700;transform:rotate(12deg);opacity:.8;border-radius:6px}
.tgmap{width:100%;max-width:460px;display:block;margin:6px auto}
.tl{width:100%}.tl text,.tgmap text{font-family:var(--font)}
.h2{margin:4px 0 8px;font-size:23px}
.shapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.shape{font:inherit;font-size:17px;border:2px solid var(--ink);background:#fffaf0;color:var(--ink);padding:8px;cursor:pointer;border-radius:16px 5px 14px 6px/6px 14px 5px 16px}
.shape svg{width:100%;display:block;border-radius:8px}.shape.sel{background:#f7d58e;transform:rotate(-1.5deg);box-shadow:3px 4px 0 rgba(74,53,38,.3)}
.hypcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}
.hcard{border:2px solid var(--ink);border-top:8px solid var(--c);background:#fffaf0;padding:8px 10px;border-radius:10px 4px 10px 4px;font-size:15px}
.hcard p{margin:4px 0 0}
.matrix{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
.matrix th,.matrix td{border:1.5px solid var(--ink2);padding:5px;text-align:center}
.matrix td.ev{text-align:left}
.matrix th{background:#f3dcae}
.cell{font:inherit;font-size:22px;width:56px;height:44px;border:2px dashed var(--ink2);background:#fffdf7;color:var(--ink);cursor:pointer;border-radius:8px}
.cell.match{background:#d9ebc9;border-style:solid}.cell.diff{background:#f7d3c4;border-style:solid}
.exp{font-size:12px;color:var(--ink2)}
.matrix tr.why{display:none}.matrix.judged tr.why{display:table-row}
.matrix tr.why td{text-align:left;background:#fff8e6;font-size:14px}
.center{text-align:center;margin:10px 0}
.sl{display:flex;align-items:center;gap:8px;font-size:16px}
.sl input{width:220px;accent-color:var(--rust)}
.meter{display:inline-block;width:140px;height:16px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#e7a86b,#8a9a5b)}
.cer h3{margin:14px 0 4px;font-size:19px}
.rad{display:block;margin:3px 0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:15px;text-align:left;border:2px solid var(--ink2);background:#fffaf0;color:var(--ink);padding:4px 10px;border-radius:12px 4px 12px 4px;cursor:pointer}
.chip.on{background:#f7d58e;border-color:var(--ink)}
.report{background:#fffdf5;border:2px solid var(--ink);padding:20px 26px;max-width:820px;margin:auto}
.report h2{text-align:center;letter-spacing:4px}
.report table{border-collapse:collapse;width:100%;font-size:15px}.report td,.report th{border:1px solid var(--ink2);padding:4px 6px}
.check li{list-style:none}
@media print{header,aside,#controls,.noprint,#toast{display:none!important}main{display:block;padding:0}.card{border:none;box-shadow:none;background:none}body{background:#fff}}
</style>

<body data-layout="html">
<header>
  <div class="logo">🌊</div>
  <div><h1>深海調查員</h1><div class="sub">海底擴張之謎．1960 年代海洋探勘任務</div></div>
  <nav class="pills" id="pills"></nav>
  <button class="btn tiny alt" id="resetBtn">↺ 重新開始</button>
</header>
<main>
  <section class="card" id="stageCard">
    <div id="canvWrap"><canvas id="scene"></canvas><canvas id="chart"></canvas></div>
    <div id="htmlStage"></div>
    <div id="controls"></div>
  </section>
  <aside>
    <div class="card" id="guide"><div class="gtitle"><span class="captain">🧑‍✈️</span><b id="guideTitle"></b></div><div id="guideBody"></div></div>
    <div class="card notebook">
      <div class="tabs"><button data-tab="clues" class="on">📌 線索</button><button data-tab="notes">✏️ 我的想法</button><button data-tab="hyp">⚖️ 假說看板</button></div>
      <div id="nbBody"></div>
    </div>
  </aside>
</main>
<div id="toast"></div>

<script>
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
function rnd(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return(rnd(i)*(1-u)+rnd(i+1)*u)*2-1}
function fbm(x){return vnoise(x)*.6+vnoise(x*2.13+17)*.28+vnoise(x*4.7+41)*.12}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function niceTicks(a,b,n=6){const s0=(b-a)/n,m=Math.pow(10,Math.floor(Math.log10(s0))),r=s0/m,st=(r<1.5?1:r<3?2:r<7?5:10)*m,o=[];for(let v=Math.ceil(a/st)*st;v<=b+1e-9;v+=st)o.push(+v.toFixed(6));return o}
const FONT='"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif', INK='#4a3526';
const DPR=Math.min(window.devicePixelRatio||1,2);

/* ================= 世界模型：所有數據都由同一個擴張模型產生 ================= */
const W={V:12,EDGE:1850, // 半擴張速率 12 公里/百萬年 = 1.2 公分/年
 age(x){return Math.min(Math.abs(x),this.EDGE)/this.V},
 depth(x){const ax=Math.min(Math.abs(x),2000),t=Math.min(ax,this.EDGE)/this.V;let d=2.5+0.3*Math.sqrt(t);
  d-=0.42*Math.exp(-(((ax-24)/14)**2)); d+=0.95*Math.exp(-((x/8)**2));
  d+=(0.3*Math.exp(-ax/350)+0.05)*fbm(x/16+100);
  if(ax>this.EDGE){const s=(ax-this.EDGE)/(2000-this.EDGE),m=s*s*(3-2*s);d=d*(1-m)+0.15*m}return d},
 sed(x){const t=this.age(x);return Math.max(2,6*t*(1+0.12*fbm(x/80+7))+4*Math.abs(fbm(x/9+3)))},
 heat(x){const t=Math.max(this.age(x),0.2);return Math.min(300,Math.max(46,480/Math.sqrt(t)))}};
// 簡化版地磁倒轉年表（正向時段，百萬年前）
const NORMAL=[[0,.78],[.99,1.07],[1.78,1.95],[2.58,3.04],[3.11,3.22],[3.33,3.58],[4.19,4.3],[4.49,4.63],[4.8,4.9],[5,5.24],[5.89,6.14],[6.27,6.47],[6.57,6.7],[6.93,7.1]];
function pol(t){for(const[a,b]of NORMAL)if(t>=a&&t<b)return 1;return -1}
const MAG={X0:-90,X1:90,DX:.25};
function magArray(v,off=0,seed=null){const n=Math.round((MAG.X1-MAG.X0)/MAG.DX)+1,raw=new Float32Array(n);
 for(let i=0;i<n;i++){const x=MAG.X0+i*MAG.DX;raw[i]=pol(Math.abs(x-off)/v)}
 const sg=1.6/MAG.DX,R=Math.ceil(sg*3),k=[];let ks=0;for(let j=-R;j<=R;j++){const w=Math.exp(-j*j/(2*sg*sg));k.push(w);ks+=w}
 const o=new Float32Array(n);for(let i=0;i<n;i++){let s=0;for(let j=-R;j<=R;j++)s+=raw[clamp(i+j,0,n-1)]*k[j+R];o[i]=s/ks*260}
 if(seed!==null)for(let i=0;i<n;i++){const x=MAG.X0+i*MAG.DX;o[i]+=35*fbm(x/1.3+seed*13.7)+25*fbm(x/9+seed*3.1)}
 return o}
function magAt(a,x){const f=(x-MAG.X0)/MAG.DX,i=Math.floor(f);if(i<0)return a[0];if(i>=a.length-1)return a[a.length-1];return lerp(a[i],a[i+1],f-i)}
function corr(a,b){const n=a.length;let ma=0,mb=0;for(let i=0;i<n;i++){ma+=a[i];mb+=b[i]}ma/=n;mb/=n;let ab=0,aa=0,bb=0;for(let i=0;i<n;i++){const da=a[i]-ma,db=b[i]-mb;ab+=da*db;aa+=da*da;bb+=db*db}return ab/Math.sqrt(aa*bb||1)}
const TRACK_OFF=[-5,-2,0,1,3,6];
const TR=TRACK_OFF.map((o,i)=>magArray(12,o,i+1));
const M12=magArray(12,0,null);
function slabZ(x){return .25*x+.0009*x*x}
function genQuakes(){const q=[];for(let i=0;i<230;i++){const x=460*Math.pow(Math.random(),1.25);q.push({x:+x.toFixed(1),z:+(slabZ(x)+3+Math.abs(gauss())*9).toFixed(1),s:1})}
 for(let i=0;i<45;i++)q.push({x:+(40+Math.random()*380).toFixed(1),z:+(2+Math.random()*28).toFixed(1),s:0});
 for(let i=0;i<15;i++)q.push({x:+(-90+Math.random()*80).toFixed(1),z:+(2+Math.random()*22).toFixed(1),s:0});
 for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}return q}

/* ================= 狀態與儲存 ================= */
const KEY='seafloor-inquiry-v1';
function fresh(){return{step:0,maxStep:0,name:'',clues:[],clueText:{},log:[],hyp:{A:'未檢驗',B:'未檢驗',C:'未檢驗'},sonar:[],zoom:false,pred1:null,
 sed:[],predSed:[],heat:[],predHeat:[],tracks:[],matrix:{},rate:null,drills:[],quakes:[],dip:null,report:{claim:'',ev:[],reason:'',limit:''}}}
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const CLUES={
 ridge:{icon:'⛰️',t:'大洋中央有一條綿延的海底山脈（中洋脊）',src:'聲納'},
 rift:{icon:'🕳️',t:'中洋脊山頂正中央有一道凹陷的裂谷',src:'聲納'},
 deepen:{icon:'📉',t:'離中洋脊越遠，海越深，而且左右大致對稱',src:'聲納'},
 sed:{icon:'🟫',t:'沉積物：中洋脊頂端非常薄，越往兩側越厚',src:'震測儀'},
 heat:{icon:'🔥',t:'熱流：中洋脊附近最高（數據較分散），往兩側逐漸降低',src:'熱流探針'},
 mag:{icon:'🦓',t:'磁異常條帶與中洋脊平行，並以中洋脊為中心左右鏡像對稱',src:'磁力儀'},
 magtime:{icon:'📜',t:'條帶的寬窄順序與陸地熔岩的「地磁倒轉年表」一致',src:'磁力儀＋陸地電報'},
 rate:{icon:'📏',t:'由磁條帶推算出擴張速率',src:'模型擬合'},
 drill:{icon:'🧪',t:'鑽探定年：岩石年齡隨距離增加，與預測相符；最老洋殼只有約 1.5～1.8 億年',src:'深海鑽探'},
 trench:{icon:'🌋',t:'海溝下方的震源沿著一條傾斜帶分布，深達約 300 公里',src:'地震紀錄'}};
const HYP={
 A:{name:'A．海底固定說',c:'#8a9a5b',d:'海底是一整塊古老、不會移動的岩石，和大陸一樣老。中洋脊只是一座普通的海底山脈。'},
 B:{name:'B．地球膨脹說',c:'#d98b7a',d:'地球像氣球一樣慢慢變大，中洋脊是地表被撐開的裂口，新岩石從裂口冒出來填補。（歷史上真的有科學家支持！）'},
 C:{name:'C．海底擴張說',c:'#f0b54f',d:'中洋脊處的板塊被拉開，地函物質上升形成新洋殼；新洋殼往兩側移動，最後在別處沉回地球內部。地球大小不變。'}};
const PRED_NAME={A:'平坦的海底平原',B:'像碗一樣，中間最深',C:'中間有山脈隆起'};
const clueText=id=>S.clueText[id]||CLUES[id].t;

/* ================= 手繪風繪圖 ================= */
function sketchLine(ctx,x1,y1,x2,y2,{w=1,p=2}={}){const sd=x1*.137+y1*.711+x2*.373+y2*.531,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
 for(let k=0;k<p;k++){const a=(rnd(sd+k*7.1)-.5)*2*w,b=(rnd(sd+k*3.3+1)-.5)*2*w,c=(rnd(sd+k*5.7+2)-.5)*3*w;ctx.beginPath();ctx.moveTo(x1+nx*a,y1+ny*a);ctx.quadraticCurveTo((x1+x2)/2+nx*c,(y1+y2)/2+ny*c,x2+nx*b,y2+ny*b);ctx.stroke()}}
function sketchRect(ctx,x,y,w,h){sketchLine(ctx,x,y,x+w,y);sketchLine(ctx,x+w,y,x+w,y+h);sketchLine(ctx,x+w,y+h,x,y+h);sketchLine(ctx,x,y+h,x,y)}
function pencil(ctx,pts,{color=INK,width=2}={}){if(pts.length<2)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='round';ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.stroke();

class Chart{constructor(c){this.c=c;this.set({})}
 set(o){Object.assign(this,{xmin:-2000,xmax:2000,ymin:0,ymax:1,inv:false},o);this.pad=Object.assign({l:62,r:18,t:24,b:40},o.pad||{});return this}
 get w(){return this.c.clientWidth}get h(){return this.c.clientHeight}
 X(x){return this.pad.l+(x-this.xmin)/(this.xmax-this.xmin)*(this.w-this.pad.l-this.pad.r)}
 Y(y){const t=(y-this.ymin)/(this.ymax-this.ymin),ph=this.h-this.pad.t-this.pad.b;return this.inv?this.pad.t+t*ph:this.h-this.pad.b-t*ph}
 iX(px){return this.xmin+(px-this.pad.l)/(this.w-this.pad.l-this.pad.r)*(this.xmax-this.xmin)}
 iY(py){const ph=this.h-this.pad.t-this.pad.b,t=this.inv?(py-this.pad.t)/ph:(this.h-this.pad.b-py)/ph;return this.ymin+t*(this.ymax-this.ymin)}}

function axes(ctx,ch,{xt,yt,xfmt=v=>v,yfmt=v=>v,xlabel='',ylabel=''}){const L=ch.pad.l,R=ch.w-ch.pad.r,T=ch.pad.t,B=ch.h-ch.pad.b;

 for(const v of xt){const x=ch.X(v);ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,B);ctx.stroke()}
 for(const v of yt){const y=ch.Y(v);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R,y);ctx.stroke()}ctx.restore();
 ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.fillStyle=INK;ctx.font=`13px ${FONT}`;
 sketchLine(ctx,L,B,R,B);sketchLine(ctx,L,T,L,B);
 ctx.textAlign='center';ctx.textBaseline='top';for(const v of xt)ctx.fillText(xfmt(v),ch.X(v),B+6);
 ctx.textAlign='right';ctx.textBaseline='middle';for(const v of yt)ctx.fillText(yfmt(v),L-6,ch.Y(v));
 if(xlabel){ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(xlabel,(L+R)/2,ch.h-2)}
 if(ylabel){ctx.translate(13,(T+B)/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ylabel,0,0)}ctx.restore()}

function mcq(q,opts,{multi=false,onDone}={}){const d=add(`<div class="q"><div class="qt">❓ ${q}</div><div class="opts"></div><div class="fb"></div></div>`);
 const qb=d.querySelector('.q'),box=d.querySelector('.opts'),fb=d.querySelector('.fb');
 if(!multi){opts.forEach(o=>{const b=el('button','opt',o.t);b.onclick=()=>{if(d.dataset.done)return;box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
   fb.className='fb '+(o.ok?'good':'hmm');fb.innerHTML=o.fb||(o.ok?'✅ 沒錯！':'🤔 再想想看。');if(o.ok){d.dataset.done=1;box.querySelectorAll('.opt').forEach(x=>x.disabled=true);onDone&&onDone(o)}};box.appendChild(b)})}
 else{opts.forEach(o=>{const b=el('button','opt','☐ '+o.t);b.onclick=()=>{if(d.dataset.done)return;b.classList.toggle('sel');b.innerHTML=(b.classList.contains('sel')?'☑ ':'☐ ')+o.t};box.appendChild(b)});
  const cb=btn('確認',()=>{if(d.dataset.done)return;let miss=0,wrong=0;[...box.children].forEach((b,i)=>{const s=b.classList.contains('sel');if(opts[i].ok&&!s)miss++;if(!opts[i].ok&&s)wrong++});
   if(!miss&&!wrong){d.dataset.done=1;fb.className='fb good';fb.innerHTML='✅ 觀察得很仔細！';[...box.children].forEach(b=>b.disabled=true);cb.disabled=true;onDone&&onDone()}
   else{fb.className='fb hmm';fb.innerHTML=`🤔 ${wrong?`有 ${wrong} 項可能不對；`:''}${miss?`還漏了 ${miss} 項。`:''}再仔細看看圖！`}},'btn sm');cb.style.marginTop='6px';qb.insertBefore(cb,fb)}

  if(Math.abs(v-ans)<=tol){d.dataset.done=1;inp.disabled=true;fb.className='fb good';fb.innerHTML='✅ '+good;onDone&&onDone(v)}
  else{const tp=traps.find(x=>Math.abs(v-x.v)<=Math.max(tol,Math.abs(x.v)*.02));fb.className='fb hmm';fb.innerHTML=tp?tp.fb:'🤔 再算一次看看'+(v>ans?'（太大了）':'（太小了）')}},'btn sm'));
